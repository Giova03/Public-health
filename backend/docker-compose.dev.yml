# Environnement de développement local — base + API.
# Le PWA tourne à part : `npm run dev` à la racine du monorepo.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Migrations Flyway appliquées au démarrage de l'API.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: publichealth
      POSTGRES_PASSWORD: publichealth
      POSTGRES_DB: publichealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publichealth"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/publichealth
      DATABASE_USER: publichealth
      DATABASE_PASSWORD: publichealth
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
