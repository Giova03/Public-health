# Copie du application.yml principal AVEC l'override sécurité :
# la suite existante (229 tests) a été écrite en posture Sprint 0
# (API ouverte) ; JwtSecuriteIT et AuthRbacIT réactivent
# securite.jwt.actif=true avec un secret de test inline.
spring:
  application:
    name: public-health-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/publichealth}
    username: ${DATABASE_USER:publichealth}
    password: ${DATABASE_PASSWORD:publichealth}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

fedapay:
  webhook-secret: ${FEDAPAY_WEBHOOK_SECRET:dev-secret-change-me}
  webhook-signature-header: X-FedaPay-Signature
  event-id-header: X-Event-Id

securite:
  jwt:
    actif: false
    secret: secret-hs256-de-test-public-health-0123456789
  ratelimit:
    actif: true

auth:
  demo-otp-visible: true
