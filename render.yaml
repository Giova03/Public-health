# Blueprint Render — déploiement staging.
# 1. Créer le dépôt GitHub (voir scripts/push-to-github.sh) puis « New + Blueprint »
#    sur https://dashboard.render.com en pointant sur ce dépôt.
# 2. Renseigner FEDAPAY_WEBHOOK_SECRET dans l'environnement Render (secret).
#
# NB : plan « starter » pour l'API (runtime Docker payant chez Render),
# base « free » pour le staging (expire après 90 jours — suffisant pour P0).

services:
  - type: web
    name: ph-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ph-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      # Sécurité V14 (audit I1) : JWT ACTIF par défaut — un secret dédié
      # est EXIGÉ (généré une fois, > 32 caractères, jamais commité).
      - key: SECURITE_JWT_ACTIF
        value: "true"
      - key: SECURITE_JWT_SECRET
        sync: false
      # En production : les codes OTP/MFA ne sont plus renvoyés dans les
      # réponses — le module notification (P2) prendra le relais.
      - key: AUTH_DEMO_OTP_VISIBLE
        value: "false"
      - key: APP_ORIGINES
        value: https://public-health.vercel.app

databases:
  - name: ph-db
    plan: free
    databaseName: publichealth
    user: publichealth
