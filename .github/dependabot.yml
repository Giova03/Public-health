version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(pwa)"

  - package-ecosystem: maven
    directory: "/services/api"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(api)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
